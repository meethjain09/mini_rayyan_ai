<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Rayyan AI</title>
    <meta name="description" content="AI-assisted systematic review screening platform designed for medical researchers to replicate the core workflows of Rayyan.ai." />
    <meta property="og:title" content="Mini Rayyan AI" />
    <meta property="og:description" content="AI-assisted systematic review screening platform designed for medical researchers to replicate the core workflows of Rayyan.ai." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        background-color: #05120d;
        color: #ecfdf5;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-y: auto !important;
        overflow-x: hidden;
      }
    </style>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          setTimeout(function() {
            if (root && !root.hasChildNodes()) {
              root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05120d;color:#ecfdf5;padding:24px;text-align:center;">' +
                '<div style="max-width:480px;margin:auto;padding:32px;background:rgba(6,26,18,0.9);border:1px solid rgba(52,211,153,0.3);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,0.5);">' +
                '<h2 style="font-size:18px;font-weight:700;margin:0 0 8px;">Mini-Rayyan Initializing</h2>' +
                '<p style="font-size:13px;color:#a7f3d0;margin:0 0 20px;line-height:1.5;">Preparing medical evidence screener and local database cache...</p>' +
                '<button onclick="window.location.reload()" style="background:#10b981;color:#022c22;border:none;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:13px;">Reload Workspace</button>' +
                '</div></div>';
            }
          }, 1200);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
